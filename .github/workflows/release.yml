name: Release (Tag v*)

# Стабильный релиз создаётся только явным тегом vX.Y.N.
# Тег обязан совпадать с OMW_VERSION.OMW_BUILD из project.yml.

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build_and_release:
    name: Build & Release IPA
    runs-on: macos-26
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.0.0

      - name: Install build tools
        run: |
          brew install xcodegen go
          xcodegen --version
          go version

      - name: Select latest Xcode
        run: |
          XC=$(ls -d /Applications/Xcode*.app | sort -V | tail -1)
          sudo xcode-select -s "$XC/Contents/Developer"
          xcodebuild -version

      - name: Check tag matches version
        shell: bash
        run: |
          BUILD=$(grep -m1 'OMW_BUILD:' project.yml | sed -E 's/.*"([0-9]+)".*/\1/')
          BLOCK=$(grep -m1 'OMW_VERSION:' project.yml | sed -E 's/.*"([^"]+)".*/\1/')
          EXPECTED="v$BLOCK.$BUILD"
          TAG="${{ github.ref_name }}"
          if [ "$TAG" != "$EXPECTED" ]; then
            echo "::error::Тег $TAG не совпадает с $EXPECTED из project.yml."
            exit 1
          fi

      - name: Generate Xcode project
        run: xcodegen generate

      - name: Resolve Swift packages
        run: |
          xcodebuild -resolvePackageDependencies \
            -project OmniWARP.xcodeproj \
            -scheme OmniWARP \
            -derivedDataPath "$PWD/build"

      - name: Build AmneziaWG core for device
        run: bash scripts/build-awg-core.sh "$PWD/build" Release iphoneos

      - name: Build unsigned iOS app
        run: |
          xcodebuild -project OmniWARP.xcodeproj \
            -scheme OmniWARP \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -derivedDataPath "$PWD/build" \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            DEBUG_INFORMATION_FORMAT=dwarf \
            COMPILER_INDEX_STORE_ENABLE=NO \
            build

      - name: Verify tunnel and package unsigned IPA
        run: |
          APP="build/Build/Products/Release-iphoneos/OmniWARP.app"
          test -d "$APP/PlugIns/OmniWARPTunnel.appex"
          mkdir -p Payload
          cp -R "$APP" Payload/
          zip -qry "OmniWARP-${{ github.ref_name }}.ipa" Payload
          rm -rf Payload

      - name: Publish Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release delete "${{ github.ref_name }}" --yes --cleanup-tag=false 2>/dev/null || true
          gh release create "${{ github.ref_name }}" \
            "OmniWARP-${{ github.ref_name }}.ipa" \
            --title "OmniWARP ${{ github.ref_name }}" \
            --notes "Unsigned IPA. Подпишите app и вложенный OmniWARPTunnel.appex своим сертификатом (GBox / SideStore / AltStore)." \
            --prerelease=false

      - uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4 # v5.0.0
        with:
          name: OmniWARP-${{ github.ref_name }}
          path: OmniWARP-${{ github.ref_name }}.ipa
          if-no-files-found: error
